# Claude reviewt automatisch elke pull request (bij openen en bij elke nieuwe push).
# Vereist het repository-secret ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions).
name: Claude PR-review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}

            Je bent de vaste code-reviewer van transcraiber2 (Node.js/Express + better-sqlite3,
            frontend met Bootstrap, DataTables en modale formulieren; LLM-aanroepen via OpenRouter).
            Review deze pull request op echte fouten: logica, SQL/schemamigraties (addColumn,
            ON CONFLICT), async/abort-afhandeling, XSS (gebruik App.esc bij innerHTML),
            regressies in bestaande schermen en ontbrekende tests. Geen stijlopmerkingen.

            Werkwijze:
            1. Bekijk de diff met `gh pr diff` en lees waar nodig de omliggende code.
            2. Draai `npm ci` en `npm test` (de tests gebruiken een mock-LLM).
            3. Zet per concreet probleem een inline-opmerking op de juiste regel.
            4. Sluit af met één samenvattende PR-opmerking (`gh pr comment`): testresultaat,
               gevonden problemen gerangschikt van ernstig naar klein, en of de PR mergeklaar is.
               Meld ook als de PR mergeconflicten heeft met main.
            Schrijf in het Nederlands. Wijzig zelf geen code en merge nooit.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(npm ci),Bash(npm test),Bash(git log:*),Bash(git diff:*)"
