# Transcraiber op ubuntu-docker-pdb12
# Hangt aan het bestaande Docker-netwerk "proxy", waar ook de container "cloudflare-tunnel" op zit.
# In de bestaande tunnel (Public Hostname transcraiber.smartergrp.com): HTTP → transcraiber:3000
# Gebruik: docker compose up -d --build
name: transcraiber

services:
  transcraiber:
    build: .
    image: transcraiber:latest
    container_name: transcraiber
    restart: unless-stopped
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - PORT=3000
      - DATA_DIR=/data
    volumes:
      - transcraiber-data:/data
    networks:
      - proxy
    labels:
      # lokaal gebouwd image: watchtower moet dit niet proberen te updaten
      - com.centurylinklabs.watchtower.enable=false
    # Geen hostpoort nodig: de tunnel bereikt de container via het proxy-netwerk.
    # Lokaal testen op de host? Haal de # weg:
    # ports:
    #   - "3210:3000"

networks:
  proxy:
    external: true

volumes:
  transcraiber-data:
    name: transcraiber-data
