# Transcraiber + Cloudflare Tunnel
# Gebruik: zet CLOUDFLARE_TUNNEL_TOKEN (en optioneel OPENROUTER_API_KEY) in .env, dan: docker compose up -d --build
# Tunnel-service in Cloudflare: HTTP → transcraiber:3000
name: transcraiber

services:
  transcraiber:
    build: .
    image: transcraiber:latest
    container_name: transcraiber
    restart: unless-stopped
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - PORT=3000
      - DATA_DIR=/data
    volumes:
      - transcraiber-data:/data
    networks:
      - transcraiber-net
    # Geen poorten naar buiten: enkel bereikbaar via de tunnel.
    # Lokaal testen op de host? Haal de # weg (hostpoort naar keuze):
    # ports:
    #   - "3210:3000"

  transcraiber-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: transcraiber-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?Zet CLOUDFLARE_TUNNEL_TOKEN in .env}
    networks:
      - transcraiber-net
    depends_on:
      - transcraiber

networks:
  transcraiber-net:
    name: transcraiber-net

volumes:
  transcraiber-data:
    name: transcraiber-data
